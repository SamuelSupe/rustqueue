[workspace]
resolver = "2"
members = [
    "crates/telemetry",
    "crates/protocol",
    "crates/storage",
    "crates/queue",
    "crates/server",
    "crates/discovery",
    "crates/proxy",
    "crates/bench",
    "crates/operator",
    "crates/console",
    "crates/rustqueuectl",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.95"
async-compression = { version = "0.4.42", features = ["tokio", "deflate"] }
flate2 = "1.1"
axum = "0.8.1"
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
bytes = { version = "1.9.0", features = ["serde"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.26", features = ["derive", "env"] }
crc32c = "0.6.8"
futures = "0.3.31"
hex = "0.4.3"
libc = "0.2.186"
hdrhistogram = "7.5.4"
parking_lot = "0.12.3"
rand = "0.8.5"
regex = "1.11.1"
reqwest = { version = "0.12.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
rustls = "0.23.21"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.217", features = ["derive", "rc"] }
serde_json = "1.0.137"
sha2 = "0.10.8"
tempfile = "3.15.0"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["full"] }
tokio-rustls = "0.26.1"
tokio-snappy = "0.2.0"
toml = "0.8.19"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["fs", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
rustqueue-telemetry = { path = "crates/telemetry" }
x509-parser = "0.17.0"
k8s-openapi = { version = "0.28.0", features = ["v1_33", "schemars"] }
kube = { version = "4.0.0", features = ["derive", "runtime"] }
schemars = "1.0.4"
serde_yaml = "0.9.34"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
