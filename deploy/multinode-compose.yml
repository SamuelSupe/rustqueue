x-rustqueue: &rustqueue
  image: rustqueue:dev
  build:
    context: ..
  volumes:
    - ./dev-certs:/certs:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4151/ping"]
    interval: 2s
    timeout: 1s
    retries: 45
  restart: unless-stopped

services:
  rustqueue-1:
    <<: *rustqueue
    hostname: rustqueue-1
    command: ["--config", "/etc/rustqueue.toml"]
    ports: ["4150:4150", "4151:4151"]
    volumes:
      - rustqueue-1:/data
      - ./dev-certs:/certs:ro
      - ./generated/${CLUSTER_SIZE:-4}/node-1.toml:/etc/rustqueue.toml:ro
  rustqueue-2:
    <<: *rustqueue
    hostname: rustqueue-2
    command: ["--config", "/etc/rustqueue.toml"]
    ports: ["5150:4150", "5151:4151"]
