{{- if and (gt (int .Values.operator.replicas) 1) .Values.operator.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rustqueue.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator
{{- end }}
