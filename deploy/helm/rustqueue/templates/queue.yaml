{{- if .Values.queue.create }}
apiVersion: rustqueue.io/v1alpha1
kind: RustQueue
metadata:
  name: {{ .Values.queue.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
spec:
  image: {{ .Values.queue.image | quote }}
  imagePullPolicy: {{ .Values.queue.imagePullPolicy | quote }}
  minBrokers: {{ .Values.queue.minBrokers }}
  maxBrokers: {{ .Values.queue.maxBrokers }}
  eligibleNodeSelector: {{ .Values.queue.eligibleNodeSelector | quote }}
  storageClassName: {{ .Values.queue.storageClassName | quote }}
  storageSize: {{ .Values.queue.storageSize | quote }}
  storageFeatureLevel: {{ .Values.queue.storageFeatureLevel }}
  messageIndexCacheBytes: {{ .Values.queue.messageIndexCacheBytes | int64 }}
  minFreeBytes: {{ .Values.queue.minFreeBytes | int64 }}
  diskHighWatermarkPercent: {{ .Values.queue.diskHighWatermarkPercent }}
  diskLowWatermarkPercent: {{ .Values.queue.diskLowWatermarkPercent }}
  protectiveEvictionEnabled: {{ .Values.queue.protectiveEvictionEnabled }}
  diskPressureGraceSeconds: {{ .Values.queue.diskPressureGraceSeconds }}
  bootstrapRetentionSeconds: {{ .Values.queue.bootstrapRetentionSeconds }}
  maxMessageBytes: {{ .Values.queue.maxMessageBytes | int64 }}
  maxTopics: {{ .Values.queue.maxTopics | int64 }}
  maxPublishWorkers: {{ .Values.queue.maxPublishWorkers | int64 }}
  publishWorkerIdleSeconds: {{ .Values.queue.publishWorkerIdleSeconds | int64 }}
  detailedQueueMetrics: {{ .Values.queue.detailedQueueMetrics }}
  maxDetailedMetricSeries: {{ .Values.queue.maxDetailedMetricSeries | int64 }}
  consoleManagementEnabled: {{ and .Values.console.enabled .Values.console.management.enabled }}
  discoveryReplicas: {{ .Values.queue.discoveryReplicas }}
  proxyNodeSelector:
    {{- toYaml .Values.queue.proxyNodeSelector | nindent 4 }}
  rollout:
    paused: {{ .Values.queue.rollout.paused }}
    requireCanaryApproval: {{ .Values.queue.rollout.requireCanaryApproval }}
    timeoutSeconds: {{ .Values.queue.rollout.timeoutSeconds }}
    retryNonce: {{ .Values.queue.rollout.retryNonce | quote }}
    {{- if .Values.queue.rollout.approvedRevision }}
    approvedRevision: {{ .Values.queue.rollout.approvedRevision | quote }}
    {{- end }}
    {{- if .Values.queue.rollout.rollbackToImage }}
    rollbackToImage: {{ .Values.queue.rollout.rollbackToImage | quote }}
    {{- end }}
  brokerScheduling:
    topologyKey: {{ .Values.queue.brokerScheduling.topologyKey | quote }}
    {{- if .Values.queue.brokerScheduling.priorityClassName }}
    priorityClassName: {{ .Values.queue.brokerScheduling.priorityClassName | quote }}
    {{- end }}
    tolerations:
      {{- toYaml .Values.queue.brokerScheduling.tolerations | nindent 6 }}
  brokerResources:
    cpuRequest: {{ .Values.queue.brokerResources.cpuRequest | quote }}
    memoryRequest: {{ .Values.queue.brokerResources.memoryRequest | quote }}
    {{- if .Values.queue.brokerResources.cpuLimit }}
    cpuLimit: {{ .Values.queue.brokerResources.cpuLimit | quote }}
    {{- end }}
    {{- if .Values.queue.brokerResources.memoryLimit }}
    memoryLimit: {{ .Values.queue.brokerResources.memoryLimit | quote }}
    {{- end }}
  {{- if .Values.queue.registrySecretName }}
  registrySecretName: {{ .Values.queue.registrySecretName | quote }}
  {{- end }}
  {{- if .Values.queue.clientTlsSecretName }}
  clientTlsSecretName: {{ .Values.queue.clientTlsSecretName | quote }}
  {{- end }}
{{- end }}
