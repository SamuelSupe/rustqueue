{{- if .Values.queue.create }}
{{- if .Values.queue.kodoCompatibility.cleanupEnabled }}
{{- fail "queue.kodoCompatibility.cleanupEnabled is disabled until cluster-wide atomic deletion is available" }}
{{- end }}
{{- if and .Values.queue.kodoCompatibility.enabled (ne .Values.queue.imagePullPolicy "Never") (not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.queue.image)) }}
{{- fail "queue.kodoCompatibility.enabled requires queue.image pinned by @sha256, or queue.imagePullPolicy=Never for a preloaded local image" }}
{{- end }}
{{- if and .Values.queue.kodoCompatibility.enabled (ne .Values.queue.publishAckMode "durable") }}
{{- fail "queue.kodoCompatibility.enabled requires queue.publishAckMode=durable" }}
{{- end }}
apiVersion: rustqueue.io/v1alpha1
kind: RustQueue
metadata:
  name: {{ .Values.queue.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
spec:
  image: {{ .Values.queue.image | quote }}
  imagePullPolicy: {{ .Values.queue.imagePullPolicy | quote }}
  minBrokers: {{ ternary 3 .Values.queue.minBrokers .Values.queue.kodoCompatibility.enabled }}
  maxBrokers: {{ ternary 3 .Values.queue.maxBrokers .Values.queue.kodoCompatibility.enabled }}
  eligibleNodeSelector: {{ .Values.queue.eligibleNodeSelector | quote }}
  storageClassName: {{ .Values.queue.storageClassName | quote }}
  storageSize: {{ .Values.queue.storageSize | quote }}
  storageFeatureLevel: {{ ternary 2 .Values.queue.storageFeatureLevel .Values.queue.kodoCompatibility.enabled }}
  messageIndexCacheBytes: {{ .Values.queue.messageIndexCacheBytes | int64 }}
  maintenanceStartupDelaySeconds: {{ .Values.queue.maintenanceStartupDelaySeconds | int64 }}
  nodeDeliveryInflightBytes: {{ ternary 536870912 .Values.queue.nodeDeliveryInflightBytes .Values.queue.kodoCompatibility.enabled | int64 }}
  connectionDeliveryInflightBytes: {{ ternary 134217728 .Values.queue.connectionDeliveryInflightBytes .Values.queue.kodoCompatibility.enabled | int64 }}
  minFreeBytes: {{ .Values.queue.minFreeBytes | int64 }}
  diskHighWatermarkPercent: {{ .Values.queue.diskHighWatermarkPercent }}
  diskLowWatermarkPercent: {{ .Values.queue.diskLowWatermarkPercent }}
  protectiveEvictionEnabled: {{ .Values.queue.protectiveEvictionEnabled }}
  diskPressureGraceSeconds: {{ .Values.queue.diskPressureGraceSeconds }}
  bootstrapRetentionSeconds: {{ ternary 180 .Values.queue.bootstrapRetentionSeconds .Values.queue.kodoCompatibility.enabled }}
  maxMessageBytes: {{ ternary 104857600 .Values.queue.maxMessageBytes .Values.queue.kodoCompatibility.enabled | int64 }}
  maxTopics: {{ .Values.queue.maxTopics | int64 }}
  maxPublishWorkers: {{ .Values.queue.maxPublishWorkers | int64 }}
  publishWorkerIdleSeconds: {{ .Values.queue.publishWorkerIdleSeconds | int64 }}
  publishAckMode: {{ .Values.queue.publishAckMode | quote }}
  relaxedSyncMessages: {{ .Values.queue.relaxedSyncMessages | int64 }}
  relaxedSyncBytes: {{ .Values.queue.relaxedSyncBytes | int64 }}
  relaxedSyncIntervalMs: {{ .Values.queue.relaxedSyncIntervalMs | int64 }}
  detailedQueueMetrics: {{ .Values.queue.detailedQueueMetrics }}
  maxDetailedMetricSeries: {{ .Values.queue.maxDetailedMetricSeries | int64 }}
  consoleManagementEnabled: {{ and .Values.console.enabled .Values.console.management.enabled }}
  discoveryReplicas: {{ .Values.queue.discoveryReplicas }}
  proxyNodeSelector:
    {{- toYaml .Values.queue.proxyNodeSelector | nindent 4 }}
  proxyTcpMaxConnectionAgeSeconds: {{ .Values.queue.proxyTcpMaxConnectionAgeSeconds | int64 }}
  kodoCompatibility:
    enabled: {{ .Values.queue.kodoCompatibility.enabled }}
    decommissionConfirmed: {{ .Values.queue.kodoCompatibility.decommissionConfirmed }}
    producerRestartNonce: {{ .Values.queue.kodoCompatibility.producerRestartNonce | quote }}
    cleanupEnabled: {{ and .Values.queue.kodoCompatibility.enabled .Values.queue.kodoCompatibility.cleanupEnabled }}
    cutoverGraceSeconds: {{ .Values.queue.kodoCompatibility.cutoverGraceSeconds | int64 }}
    allowedPodSelector:
      {{- toYaml .Values.queue.kodoCompatibility.allowedPodSelector | nindent 6 }}
    allowedNamespaceSelector:
      {{- toYaml .Values.queue.kodoCompatibility.allowedNamespaceSelector | nindent 6 }}
  rollout:
    paused: {{ .Values.queue.rollout.paused }}
    requireCanaryApproval: {{ .Values.queue.rollout.requireCanaryApproval }}
    timeoutSeconds: {{ .Values.queue.rollout.timeoutSeconds }}
    retryNonce: {{ .Values.queue.rollout.retryNonce | quote }}
    {{- if .Values.queue.rollout.approvedRevision }}
    approvedRevision: {{ .Values.queue.rollout.approvedRevision | quote }}
    {{- end }}
    {{- if .Values.queue.rollout.rollbackToImage }}
    rollbackToImage: {{ .Values.queue.rollout.rollbackToImage | quote }}
    {{- end }}
  brokerScheduling:
    topologyKey: {{ .Values.queue.brokerScheduling.topologyKey | quote }}
    {{- if .Values.queue.brokerScheduling.priorityClassName }}
    priorityClassName: {{ .Values.queue.brokerScheduling.priorityClassName | quote }}
    {{- end }}
    tolerations:
      {{- toYaml .Values.queue.brokerScheduling.tolerations | nindent 6 }}
  brokerResources:
    cpuRequest: {{ ternary .Values.queue.kodoCompatibility.brokerCpuRequest .Values.queue.brokerResources.cpuRequest .Values.queue.kodoCompatibility.enabled | quote }}
    memoryRequest: {{ ternary .Values.queue.kodoCompatibility.brokerMemoryRequest .Values.queue.brokerResources.memoryRequest .Values.queue.kodoCompatibility.enabled | quote }}
    {{- if .Values.queue.brokerResources.cpuLimit }}
    cpuLimit: {{ .Values.queue.brokerResources.cpuLimit | quote }}
    {{- end }}
    {{- if .Values.queue.brokerResources.memoryLimit }}
    memoryLimit: {{ .Values.queue.brokerResources.memoryLimit | quote }}
    {{- end }}
  {{- if .Values.queue.registrySecretName }}
  registrySecretName: {{ .Values.queue.registrySecretName | quote }}
  {{- end }}
  {{- if .Values.queue.clientTlsSecretName }}
  clientTlsSecretName: {{ .Values.queue.clientTlsSecretName | quote }}
  {{- end }}
{{- end }}
