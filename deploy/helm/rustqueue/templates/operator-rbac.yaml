apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rustqueue.fullname" . }}-operator
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rustqueue.io"]
    resources: ["rustqueueclusters"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["rustqueue.io"]
    resources: ["rustqueueclusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "rustqueue.fullname" . }}-operator
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "rustqueue.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "rustqueue.operatorServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
