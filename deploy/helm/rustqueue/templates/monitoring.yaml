{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rustqueue.fullname" . }}-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Values.queue.name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [broker, discovery, proxy]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rustqueue.fullname" . }}-kodo-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.queue.name | quote }}
      app.kubernetes.io/component: kodo-gateway
      rustqueue.io/metrics: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "rustqueue.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "rustqueue.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rustqueue.labels" . | nindent 4 }}
spec:
  groups:
    - name: rustqueue.production
      rules:
        - alert: RustQueueOperatorHasNoLeader
          expr: (sum(rustqueue_operator_leader{namespace="{{ .Release.Namespace }}",service="{{ include "rustqueue.fullname" . }}-operator"}) or vector(0)) < 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: RustQueue Operator has no active leader
        - alert: RustQueueBrokerMetricsMissing
          expr: absent(rustqueue_disk_pressure{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-brokers"})
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: RustQueue has no Broker metrics
        - alert: RustQueueBrokerDiskPressure
          expr: rustqueue_disk_pressure{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-brokers"} == 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: RustQueue Broker is rejecting publishes due to disk pressure
        - alert: RustQueueStorageErrors
          expr: increase(rustqueue_storage_errors_total{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-brokers"}[5m]) > 0
          labels: {severity: critical}
          annotations:
            summary: RustQueue Broker reported a storage error
        - alert: RustQueueProtectiveEviction
          expr: increase(rustqueue_protective_evicted_messages_total{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-brokers"}[5m]) > 0
          labels: {severity: critical}
          annotations:
            summary: RustQueue intentionally evicted messages to protect its disk
        - alert: RustQueuePublishThrottling
          expr: rate(rustqueue_publish_throttled_requests_total{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-brokers"}[5m]) > 0
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: RustQueue publish admission has been throttling continuously
        - alert: RustQueueAmbiguousPublish
          expr: increase(rustqueue_proxy_producer_ambiguous_failures_total{namespace="{{ .Release.Namespace }}",service=~"{{ .Values.queue.name }}-(proxy|kodo-publish)"}[5m]) > 0
          labels: {severity: critical}
          annotations:
            summary: RustQueue Proxy or Kodo Gateway observed a publish with an unknown commit outcome
        - alert: RustQueueDiscoverySourceUnavailable
          expr: (min(rustqueue_discovery_source_ready{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-discovery"}) or vector(0)) == 0
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: RustQueue Discovery has no fresh Broker registry source
        - alert: RustQueueDiscoveryLookupIncomplete
          expr: (min(rustqueue_discovery_source_ready{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-discovery"}) == 1) and ((min(rustqueue_discovery_lookup_ready{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-discovery"}) or vector(0)) == 0)
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: RustQueue Discovery cannot serve a complete compatible lookup inventory
        - alert: RustQueueProxyHasNoPublishBackend
          expr: (min(rustqueue_proxy_publish_backends{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-proxy"}) or vector(0)) < 1
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: RustQueue Proxy has no publish-ready Broker
        {{- if .Values.queue.kodoCompatibility.enabled }}
        - alert: RustQueueKodoGatewayMetricsMissing
          expr: (count(rustqueue_proxy_kodo_gateway{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-kodo-publish"} == 1) or vector(0)) < 3
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: RustQueue cannot scrape all three Kodo Gateways
        - alert: RustQueueKodoGatewayBelowStartupQuorum
          expr: (min(rustqueue_proxy_publish_backends{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-kodo-publish"}) or vector(0)) < 2
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: RustQueue Kodo Gateway has fewer than two publish-ready Brokers
        - alert: RustQueueKodoStatsInventoryIncomplete
          expr: (min(rustqueue_proxy_broker_backends{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-kodo-publish"}) or vector(-1)) != 3
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: RustQueue Kodo Gateway cannot serve all three Stats shards
        {{- end }}
        - alert: RustQueueFsyncP99High
          expr: histogram_quantile(0.99, sum by (le) (rate(rustqueue_storage_fsync_duration_seconds_bucket{namespace="{{ .Release.Namespace }}",service="{{ .Values.queue.name }}-brokers"}[5m]))) > 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: RustQueue local durable fsync p99 exceeds one second
{{- end }}
