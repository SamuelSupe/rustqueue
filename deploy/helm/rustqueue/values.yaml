nameOverride: ""
fullnameOverride: ""

operator:
  replicas: 2
  image:
    repository: rustqueue-operator
    tag: "0.7.0"
    pullPolicy: IfNotPresent
  log: rustqueue_operator=info
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  podDisruptionBudget:
    enabled: true

queue:
  create: true
  name: rustqueue
  image: rustqueue:0.7.0
  imagePullPolicy: IfNotPresent
  minBrokers: 1
  maxBrokers: 500
  eligibleNodeSelector: rustqueue.io/eligible=true
  storageClassName: local-path
  storageSize: 100Gi
  storageFeatureLevel: 1
  minFreeBytes: 10737418240
  diskHighWatermarkPercent: 85
  diskLowWatermarkPercent: 75
  protectiveEvictionEnabled: true
  diskPressureGraceSeconds: 60
  bootstrapRetentionSeconds: 30
  maxMessageBytes: 20971520
  maxBacklogMessages: 10000000
  registrySecretName: ""
  clientTlsSecretName: ""
  discoveryReplicas: 2
  proxyNodeSelector: {}
  rollout:
    paused: false
    requireCanaryApproval: false
    approvedRevision: ""
    timeoutSeconds: 600
    rollbackToImage: ""
    retryNonce: ""
  brokerScheduling:
    topologyKey: kubernetes.io/hostname
    priorityClassName: ""
    tolerations: []
  brokerResources:
    cpuRequest: 100m
    memoryRequest: 256Mi
    cpuLimit: ""
    memoryLimit: ""

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
