apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rustqueues.rustqueue.io
spec:
  group: rustqueue.io
  scope: Namespaced
  names:
    kind: RustQueue
    plural: rustqueues
    singular: rustqueue
    shortNames: []
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Desired, type: integer, jsonPath: .status.desiredBrokers}
        - {name: Ready, type: integer, jsonPath: .status.readyBrokers}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [image]
              properties:
                image: {type: string, minLength: 1}
                imagePullPolicy: {type: string, default: IfNotPresent}
                minBrokers: {type: integer, format: int32, minimum: 1, default: 1}
                maxBrokers: {type: integer, format: int32, minimum: 1, default: 500}
                eligibleNodeSelector: {type: string, default: rustqueue.io/eligible=true}
                storageClassName: {type: string, default: local-path}
                storageSize: {type: string, default: 100Gi}
                minFreeBytes: {type: integer, format: int64, minimum: 0, default: 10737418240}
                diskHighWatermarkPercent: {type: integer, format: int32, minimum: 1, maximum: 100, default: 85}
                diskLowWatermarkPercent: {type: integer, format: int32, minimum: 0, maximum: 99, default: 75}
                protectiveEvictionEnabled: {type: boolean, default: true}
                diskPressureGraceSeconds: {type: integer, format: int64, minimum: 0, default: 60}
                bootstrapRetentionSeconds: {type: integer, format: int64, minimum: 1, default: 30}
                maxMessageBytes: {type: integer, format: int64, minimum: 1, maximum: 33554432, default: 20971520}
                maxBacklogMessages: {type: integer, format: int64, minimum: 1, default: 10000000}
                registrySecretName: {type: string, nullable: true}
                clientTlsSecretName: {type: string, nullable: true}
                proxyNodeSelector:
                  type: object
                  additionalProperties: {type: string}
                  default: {}
                discoveryReplicas: {type: integer, format: int32, minimum: 2, default: 2}
            status:
              type: object
              nullable: true
              properties:
                observedGeneration: {type: integer, format: int64, nullable: true}
                desiredBrokers: {type: integer, format: int32}
                readyBrokers: {type: integer, format: int32}
                phase: {type: string}
                message: {type: string}
