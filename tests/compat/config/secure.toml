log_format = "text"

[node]
id = 1
broadcast_address = "rustqueue-1"

[network]
tcp_address = "0.0.0.0:4150"
http_address = "0.0.0.0:4151"
advertised_tcp_port = 4150
advertised_http_port = 4151

[storage]
data_path = "/data"
disk_high_watermark_percent = 100
disk_low_watermark_percent = 99
min_free_bytes = 1

[security]
auth_http_addresses = ["http://auth:4181"]

[security.tls]
certificate_file = "/certs/node-1.pem"
private_key_file = "/certs/node-1.key"
client_ca_file = "/certs/ca.pem"
require_client_certificate = true
required = true

[limits]
heartbeat_interval_ms = 1000
output_buffer_size = 16384
max_output_buffer_size = 65536
output_buffer_timeout_ms = 250
min_output_buffer_timeout_ms = 25
max_output_buffer_timeout_ms = 30000
